apiVersion: batch/v1
kind: Job
metadata:
  name: generate-postgresql-samples
  namespace: bigintensive
  labels:
    app: generate-postgresql-samples
    tier: data
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: generate-postgresql-samples
        tier: data
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "In attesa di PostgreSQL..."
                sleep 2
              done
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bigintensive-secrets
                  key: POSTGRES_USER
      containers:
        - name: generate-postgresql-samples
          image: davidefast/postgresql-samples-generator:latest
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bigintensive-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bigintensive-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bigintensive-secrets
                  key: POSTGRES_PASSWORD
            - name: NUM_ATHLETES
              value: "100000"
            - name: MIN_WORKOUTS
              value: "150"
            - name: MAX_WORKOUTS
              value: "365"
            - name: CLEAR_EXISTING_DATA
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
