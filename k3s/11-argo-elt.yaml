apiVersion: v1
kind: ServiceAccount
metadata:
  name: elt-argo-runner
  namespace: bigintensive
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elt-control
  namespace: bigintensive
data:
  stop-after-window: "false"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elt-argo-runner-argo-access
  namespace: bigintensive
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "workflowtaskresults"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["elt-control"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elt-argo-runner-argo-access
  namespace: bigintensive
subjects:
  - kind: ServiceAccount
    name: elt-argo-runner
    namespace: bigintensive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elt-argo-runner-argo-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elt-argo-runner-nodes-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elt-argo-runner-nodes-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: elt-argo-runner-nodes-read
subjects:
  - kind: ServiceAccount
    name: elt-argo-runner
    namespace: bigintensive
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: elt-pipeline-template
  namespace: bigintensive
spec:
  serviceAccountName: elt-argo-runner
  entrypoint: elt-pipeline
  arguments:
    parameters:
      - name: requested-replicas
        value: ""
  templates:
    - name: elt-pipeline
      steps:
        - - name: plan
            template: compute-plan
            arguments:
              parameters:
                - name: requested-replicas
                  value: "{{workflow.parameters.requested-replicas}}"
        - - name: ingest
            template: ingest-fanout
            arguments:
              parameters:
                - name: start-id
                  value: "{{steps.plan.outputs.parameters.start-id}}"
                - name: end-id
                  value: "{{steps.plan.outputs.parameters.end-id}}"
                - name: replicas
                  value: "{{steps.plan.outputs.parameters.replicas}}"
                - name: total-workouts
                  value: "{{steps.plan.outputs.parameters.total-workouts}}"
        - - name: finalize
            template: finalize
            arguments:
              parameters:
                - name: raw-rows-pending
                  value: "{{steps.plan.outputs.parameters.raw-rows-pending}}"
        - - name: pause-before-next-window
            template: pause-before-next-window
            when: "{{steps.plan.outputs.parameters.has-more}} == true"
        - - name: check-next-window
            template: check-next-window
            when: "{{steps.plan.outputs.parameters.has-more}} == true"
        - - name: schedule-next-window
            template: schedule-next-window
            when: "{{steps.plan.outputs.parameters.has-more}} == true && {{steps.check-next-window.outputs.parameters.schedule-next-window}} == true"
            arguments:
              parameters:
                - name: requested-replicas
                  value: "{{workflow.parameters.requested-replicas}}"

    - name: compute-plan
      inputs:
        parameters:
          - name: requested-replicas
      script:
        image: davidefast/elt-mirror-postgresql-to-clickhouse:latest
        imagePullPolicy: Always
        terminationMessagePolicy: FallbackToLogsOnError
        command: [python, -u]
        envFrom:
          - configMapRef:
              name: bigintensive-config
          - secretRef:
              name: bigintensive-secrets
        source: |
          import json
          import os
          import ssl
          import traceback
          import urllib.request
          import psycopg
          import clickhouse_connect

          OUT_DIR = "/tmp/argo-out"

          def write_output(name, value):
            with open(f"{OUT_DIR}/{name}", "w", encoding="utf-8") as f:
              f.write(str(value))

          def ready_nodes_count():
            host = os.getenv("KUBERNETES_SERVICE_HOST")
            port = os.getenv("KUBERNETES_SERVICE_PORT", "443")
            if not host:
              return 1

            token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
            ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            with open(token_path, encoding="utf-8") as f:
              token = f.read().strip()

            req = urllib.request.Request(
              f"https://{host}:{port}/api/v1/nodes",
              headers={"Authorization": f"Bearer {token}"},
            )
            context = ssl.create_default_context(cafile=ca_path)
            with urllib.request.urlopen(req, context=context, timeout=10) as response:
              payload = json.loads(response.read().decode("utf-8"))

            count = 0
            for node in payload.get("items", []):
              if node.get("spec", {}).get("unschedulable"):
                continue
              conditions = node.get("status", {}).get("conditions", [])
              ready = any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions)
              if ready:
                count += 1
            return max(1, count)

          os.makedirs(OUT_DIR, exist_ok=True)
          # Create defaults early so Argo output collection does not fail noisily.
          write_output("start-id", 1)
          write_output("end-id", 0)
          write_output("replicas", 1)
          write_output("total-workouts", 0)
          write_output("raw-rows-pending", 0)
          write_output("has-more", "false")

          print("[compute-plan] start", flush=True)

          pg = None
          ch = None
          try:
            print("[compute-plan] connecting to PostgreSQL", flush=True)
            pg = psycopg.connect(
              host=os.getenv("POSTGRES_HOST", "postgres"),
              port=int(os.getenv("POSTGRES_PORT", "5432")),
              dbname=os.getenv("POSTGRES_DB", "bigintensive"),
              user=os.getenv("POSTGRES_USER", "postgres"),
              password=os.getenv("POSTGRES_PASSWORD", "postgres"),
            )

            clickhouse_database = os.getenv("CLICKHOUSE_DB") or os.getenv("CLICKHOUSE_DATABASE", "bigintensive")
            print(
              f"[compute-plan] connecting to ClickHouse host={os.getenv('CLICKHOUSE_HOST', 'clickhouse')} db={clickhouse_database}",
              flush=True,
            )
            ch = clickhouse_connect.get_client(
              host=os.getenv("CLICKHOUSE_HOST", "clickhouse"),
              port=int(os.getenv("CLICKHOUSE_PORT", "8123")),
              username=os.getenv("CLICKHOUSE_USER", "default"),
              password=os.getenv("CLICKHOUSE_PASSWORD", ""),
              database=clickhouse_database,
            )

            print("[compute-plan] querying checkpoints", flush=True)
            with pg.cursor() as cur:
              cur.execute("SELECT COALESCE(MAX(id), 0) FROM allenamenti")
              postgres_max_id = int(cur.fetchone()[0] or 0)

              max_final_row = ch.query(
                f"SELECT max(allenamento_id) FROM {clickhouse_database}.allenamenti"
              ).result_rows[0][0]
              max_raw_row = ch.query(
                f"SELECT max(allenamento_id) FROM {clickhouse_database}.allenamenti_raw"
              ).result_rows[0][0]
              raw_rows_pending = int(
                ch.query(f"SELECT count() FROM {clickhouse_database}.allenamenti_raw").result_rows[0][0] or 0
              )

            max_final = int(max_final_row) if max_final_row is not None else 0

            # Only finalized data advances the workflow window. RAW may contain
            # disjoint successful worker ranges after a failed fan-out.
            start_id = max_final + 1
            # One workflow handles one bounded window, shared by all workers.
            end_id = min(postgres_max_id, start_id + 1_000_000 - 1)
            total_workouts = max(0, (end_id - start_id) + 1)
            has_more = end_id < postgres_max_id

            ready_nodes = ready_nodes_count()
            requested = "{{inputs.parameters.requested-replicas}}".strip()
            requested_replicas = int(requested) if requested.isdigit() else ready_nodes
            replicas = max(1, min(requested_replicas, ready_nodes, 3))
            if total_workouts > 0:
              replicas = max(1, min(replicas, total_workouts))
            else:
              replicas = 1

            write_output("start-id", start_id)
            write_output("end-id", end_id)
            write_output("replicas", replicas)
            write_output("total-workouts", total_workouts)
            write_output("raw-rows-pending", raw_rows_pending)
            write_output("has-more", str(has_more).lower())

            print(
              f"[compute-plan] done start_id={start_id} end_id={end_id} replicas={replicas} total_workouts={total_workouts} has_more={has_more} raw_rows_pending={raw_rows_pending}",
              flush=True,
            )
          except Exception as error:
            print(f"[compute-plan] failed: {error}", flush=True)
            traceback.print_exc()
            raise
          finally:
            if pg is not None:
              pg.close()
            if ch is not None:
              ch.close()
      outputs:
        parameters:
          - name: start-id
            valueFrom:
              path: /tmp/argo-out/start-id
          - name: end-id
            valueFrom:
              path: /tmp/argo-out/end-id
          - name: replicas
            valueFrom:
              path: /tmp/argo-out/replicas
          - name: total-workouts
            valueFrom:
              path: /tmp/argo-out/total-workouts
          - name: raw-rows-pending
            valueFrom:
              path: /tmp/argo-out/raw-rows-pending
          - name: has-more
            valueFrom:
              path: /tmp/argo-out/has-more

    - name: ingest-fanout
      inputs:
        parameters:
          - name: start-id
          - name: end-id
          - name: replicas
          - name: total-workouts
      steps:
        - - name: ingest-worker
            template: ingest-worker
            arguments:
              parameters:
                - name: start-id
                  value: "{{inputs.parameters.start-id}}"
                - name: end-id
                  value: "{{inputs.parameters.end-id}}"
                - name: replicas
                  value: "{{inputs.parameters.replicas}}"
                - name: worker-index
                  value: "{{item}}"
            withSequence:
              count: "{{inputs.parameters.replicas}}"

    - name: ingest-worker
      inputs:
        parameters:
          - name: start-id
          - name: end-id
          - name: replicas
          - name: worker-index
      container:
        image: davidefast/elt-mirror-postgresql-to-clickhouse:latest
        imagePullPolicy: Always
        terminationMessagePolicy: FallbackToLogsOnError
        command: [python, -u, copyWorkoutToClickhouse.py]
        envFrom:
          - configMapRef:
              name: bigintensive-config
          - secretRef:
              name: bigintensive-secrets
        env:
          - name: ELT_RUN_MODE
            value: ingest
          - name: ELT_GLOBAL_START_ID
            value: "{{inputs.parameters.start-id}}"
          - name: ELT_GLOBAL_END_ID
            value: "{{inputs.parameters.end-id}}"
          - name: ELT_TOTAL_WORKERS
            value: "{{inputs.parameters.replicas}}"
          - name: ELT_WORKER_INDEX
            value: "{{inputs.parameters.worker-index}}"
          - name: ELT_CYCLE_WORKOUTS
            value: "1000000"
          - name: ELT_CYCLE_PAUSE_SECONDS
            value: "30"

    - name: pause-before-next-window
      suspend:
        duration: 30s

    - name: check-next-window
      script:
        image: davidefast/elt-mirror-postgresql-to-clickhouse:latest
        imagePullPolicy: Always
        command: [python, -u]
        source: |
          import json
          import os
          import ssl
          import urllib.request

          output_path = "/tmp/argo-out/schedule-next-window"
          host = os.environ["KUBERNETES_SERVICE_HOST"]
          port = os.getenv("KUBERNETES_SERVICE_PORT", "443")
          namespace = os.getenv("KUBERNETES_NAMESPACE", "bigintensive")
          token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          with open(token_path, encoding="utf-8") as file:
            token = file.read().strip()
          request = urllib.request.Request(
            f"https://{host}:{port}/api/v1/namespaces/{namespace}/configmaps/elt-control",
            headers={"Authorization": f"Bearer {token}"},
          )
          context = ssl.create_default_context(cafile=ca_path)
          with urllib.request.urlopen(request, context=context, timeout=10) as response:
            control = json.loads(response.read().decode("utf-8"))

          stop_requested = control.get("data", {}).get("stop-after-window", "false").lower() == "true"
          with open(output_path, "w", encoding="utf-8") as file:
            file.write(str(not stop_requested).lower())
          print(f"[elt-control] stop-after-window={stop_requested}", flush=True)
      outputs:
        parameters:
          - name: schedule-next-window
            valueFrom:
              path: /tmp/argo-out/schedule-next-window

    - name: schedule-next-window
      inputs:
        parameters:
          - name: requested-replicas
      resource:
        action: create
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: elt-argo-window-
            namespace: bigintensive
            labels:
              app: elt-copy-workout
              elt-orchestrator: argo
          spec:
            workflowTemplateRef:
              name: elt-pipeline-template
            arguments:
              parameters:
                - name: requested-replicas
                  value: "{{inputs.parameters.requested-replicas}}"

    - name: finalize
      inputs:
        parameters:
          - name: raw-rows-pending
      container:
        image: davidefast/elt-mirror-postgresql-to-clickhouse:latest
        imagePullPolicy: Always
        terminationMessagePolicy: FallbackToLogsOnError
        command: [python, -u, copyWorkoutToClickhouse.py]
        envFrom:
          - configMapRef:
              name: bigintensive-config
          - secretRef:
              name: bigintensive-secrets
        env:
          - name: ELT_RUN_MODE
            value: finalize
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: elt-pipeline-nightly
  namespace: bigintensive
spec:
  schedule: "0 2 * * *"
  timezone: Europe/Rome
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  workflowMetadata:
    labels:
      app: elt-copy-workout
      elt-orchestrator: argo
  workflowSpec:
    workflowTemplateRef:
      name: elt-pipeline-template
    arguments:
      parameters:
        - name: requested-replicas
          value: ""
