apiVersion: v1
kind: Namespace
metadata:
  name: bigintensive
---
apiVersion: v1
kind: Secret
metadata:
  name: bigintensive-secrets
  namespace: bigintensive
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  CLICKHOUSE_PASSWORD: ""
  JUPYTER_TOKEN: changeme
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bigintensive-config
  namespace: bigintensive
data:
  POSTGRES_DB: bigintensive
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  BACKEND_PORT: "3001"
  FRONTEND_PORT: "5173"
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: bigintensive
  CLICKHOUSE_DATABASE: bigintensive
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  PYTHON_BIN: python3
  CORS_ORIGIN: http://bigintensive.local,http://localhost:5173,http://127.0.0.1:5173
