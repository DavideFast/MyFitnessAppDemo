---
# ClickHouse Client Service (per accesso esterno)
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-client
  namespace: bigintensive
spec:
  type: ClusterIP
  selector:
    app: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native

---
# ClickHouse Init Job (crea tabelle)
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: bigintensive
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: clickhouse-init
          image: clickhouse/clickhouse-server:24.1
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # Wait for ClickHouse to be ready
              ready=0
              for i in $(seq 1 60); do
                if clickhouse-client --host clickhouse-shard-1-0.clickhouse-shard-1.bigintensive.svc.cluster.local --port 9000 --query "SELECT 1" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                echo "Waiting for ClickHouse... ($i/60)"
                sleep 2
              done

              if [ "$ready" -ne 1 ]; then
                echo "ClickHouse is not ready after timeout"
                exit 1
              fi

              for host in clickhouse-shard-1-0.clickhouse-shard-1.bigintensive.svc.cluster.local clickhouse-shard-1-1.clickhouse-shard-1.bigintensive.svc.cluster.local clickhouse-shard-2-0.clickhouse-shard-2.bigintensive.svc.cluster.local clickhouse-shard-2-1.clickhouse-shard-2.bigintensive.svc.cluster.local; do
                ready=0
                for i in $(seq 1 60); do
                  if clickhouse-client --host "$host" --port 9000 --query "SELECT 1" >/dev/null 2>&1; then
                    ready=1
                    break
                  fi
                  echo "Waiting for $host... ($i/60)"
                  sleep 2
                done
                if [ "$ready" -ne 1 ]; then
                  echo "$host is not ready after timeout"
                  exit 1
                fi
                clickhouse-client --host "$host" --port 9000 --multiquery < /schema/schema.sql
              done

              echo "ClickHouse initialization completed!"
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse-shard-1-0.clickhouse-shard-1.bigintensive.svc.cluster.local
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: clickhouse-schema
