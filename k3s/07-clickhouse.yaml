    - port: 9009
      name: interserver
---
# ClickHouse shard 1 (two replicas on different Kubernetes nodes)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-shard-1
  namespace: bigintensive
spec:
  serviceName: clickhouse-shard-1
  podManagementPolicy: Parallel
  replicas: 2
  selector:
    matchLabels:
      app: clickhouse
      shard: "1"
  template:
    metadata:
      labels:
        app: clickhouse
        shard: "1"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: clickhouse
                  shard: "1"
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-clickhouse-macros
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              ordinal="${POD_NAME##*-}"
              cat > /dynamic-config/macros.xml <<EOF
              <clickhouse><macros><shard>1</shard><replica>$((ordinal + 1))</replica></macros></clickhouse>
              EOF
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: dynamic-config
              mountPath: /dynamic-config
        - name: wait-for-clickhouse-peers
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for host in \
                clickhouse-shard-1-0.clickhouse-shard-1.bigintensive.svc.cluster.local \
                clickhouse-shard-1-1.clickhouse-shard-1.bigintensive.svc.cluster.local \
                clickhouse-shard-2-0.clickhouse-shard-2.bigintensive.svc.cluster.local \
                clickhouse-shard-2-1.clickhouse-shard-2.bigintensive.svc.cluster.local; do
                until nslookup "$host" >/dev/null 2>&1; do sleep 2; done
              done
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.1
          securityContext:
            runAsUser: 101
            runAsGroup: 101
          ports:
            - { containerPort: 8123, name: http }
            - { containerPort: 9000, name: native }
            - { containerPort: 9009, name: interserver }
          env:
            - { name: CLICKHOUSE_DB, value: bigintensive }
            - { name: CLICKHOUSE_USER, value: default }
            - { name: CLICKHOUSE_PASSWORD, value: "" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: logs, mountPath: /var/log/clickhouse-server }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/bigintensive.xml, subPath: bigintensive.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/bigintensive-users.xml, subPath: bigintensive-users.xml }
            - { name: dynamic-config, mountPath: /etc/clickhouse-server/config.d/zz-macros.xml, subPath: macros.xml }
          resources:
            requests: { memory: "1Gi", cpu: "500m" }
            limits: { memory: "2Gi", cpu: "1000m" }
          livenessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: clickhouse-config }
        - name: dynamic-config
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Gi
