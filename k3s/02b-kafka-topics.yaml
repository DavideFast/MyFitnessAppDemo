apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-init
  namespace: bigintensive
data:
  create-topics.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "Waiting for Kafka bootstrap to become available..."
    until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; do
      echo "Kafka not ready yet; retrying in 5s..."
      sleep 5
    done

    echo "Ensuring required Kafka topics exist..."

    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic demo-events --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=604800000
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic heart-rate-events --partitions 6 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=604800000 --config segment.bytes=1073741824
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic workout-events --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=1209600000
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic smartwatch-status --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=259200000
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic spark-analytics --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=604800000
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic system-events --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config cleanup.policy=delete --config retention.ms=259200000

    echo "Kafka topics are ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: bigintensive
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics-init
          image: apache/kafka:3.7.0
          command:
            - /bin/bash
            - -c
            - |
              chmod +x /scripts/create-topics.sh
              /scripts/create-topics.sh
          volumeMounts:
            - name: create-topics
              mountPath: /scripts
      volumes:
        - name: create-topics
          configMap:
            name: kafka-topics-init
            defaultMode: 0755
